name: Build

# Every push to main, every pull request and every release tag is checked
# (formatting, clang-tidy, shellcheck, sanitizer tests, coverage, a short
# fuzz run) and
# packaged for every target on both x86_64 and arm64. Pushing a tag such as
# v0.1.0 also publishes a GitHub Release with all the packages attached, a
# SHA256SUMS file and build provenance attestations.
#
# Each job runs the same scripts as local podman builds, so a target that
# builds locally builds the same way here. Actions are pinned to commits;
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Runs first and is quick. Every other job needs it, so on a release tag a
  # tag, CMakeLists.txt and CHANGELOG.md that disagree stop everything before
  # any check runs or any package is built.
  version:
    name: Version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version, and on a release tag its changelog entry
        run: |
          version=$(sed -n 's/^project(markdown-glass VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "Version in CMakeLists.txt: $version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME#v}
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)"
              exit 1
            fi
            if ! scripts/package/changelog.sh notes "$tag" >/dev/null; then
              echo "::error::CHANGELOG.md has no entry for this release. Add a section headed: ## [$tag] - $(date -u +%Y-%m-%d)"
              exit 1
            fi
            echo "CHANGELOG.md entry for $tag:"
            scripts/package/changelog.sh notes "$tag"
          fi

  checks:
    name: Format, static analysis, sanitizers, coverage and fuzzing
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Formatting
        run: scripts/format.sh --check
      - name: Static analysis (clang-tidy and shellcheck)
        run: scripts/lint.sh
      - name: Tests under AddressSanitizer and UBSan
        run: scripts/test.sh --sanitize
      - name: Line coverage (at least 85%)
        run: scripts/coverage.sh
      - name: Fuzzing (30 seconds per target)
        run: scripts/fuzz.sh 30

  package:
    name: ${{ matrix.target }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        target:
          - fedora-43
          - fedora-44
          - almalinux-10
          - opensuse-tumbleweed
          - opensuse-leap-16
          - debian-13
          - ubuntu-26.04
          - ubuntu-26.10
          - appimage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The AppImage builds its own minimal Qt; that takes a while, so keep it.
      - name: Restore AppImage build cache
        if: matrix.target == 'appimage'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The built Qt and tools; the downloaded sources are not needed again.
          path: |
            .cache/appimage
            !.cache/appimage/downloads
          key: appimage-${{ matrix.arch }}-${{ hashFiles('scripts/package/build-appimage.sh') }}
          restore-keys: appimage-${{ matrix.arch }}-

      - name: Build, test and package
        env:
          CONTAINER_ENGINE: docker
        run: scripts/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-glass-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          merge-multiple: true

      # Lets anyone check a download came from this workflow and commit:
      #   gh attestation verify <file> --repo <owner>/markdown-glass
      # Attestations need a public repository (or a paid plan for a private one).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/package/changelog.sh notes "${GITHUB_REF_NAME#v}" > release-notes.md
          cd packages
          sha256sum -- * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Markdown Glass ${GITHUB_REF_NAME#v}" --notes-file ../release-notes.md ./*
